<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="1020" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ec4d8"/>
    </marker>
    <marker id="aDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7a99"/>
    </marker>
    <marker id="aStop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f26d6d"/>
    </marker>
  </defs>

  <rect width="1020" height="420" rx="10" fill="#0d1726"/>
  <text x="30" y="38" fill="#7fe3f0" font-size="15" font-weight="600" letter-spacing="1.5">MISSION STATE MACHINE — /harmony/robot_status</text>
  <line x1="30" y1="50" x2="990" y2="50" stroke="#1e3550" stroke-width="1"/>

  <!-- states -->
  <rect x="46" y="150" width="170" height="72" rx="8" fill="#14243a" stroke="#3c5a78" stroke-width="1.5"/>
  <text x="131" y="182" fill="#e6f1f5" font-size="16" font-weight="600" text-anchor="middle">Idle</text>
  <text x="131" y="204" fill="#8aa4bd" font-size="12" text-anchor="middle">mission not started</text>

  <rect x="286" y="150" width="170" height="72" rx="8" fill="#14243a" stroke="#2ec4d8" stroke-width="1.5"/>
  <text x="371" y="182" fill="#e6f1f5" font-size="16" font-weight="600" text-anchor="middle">Sensing</text>
  <text x="371" y="204" fill="#7fe3f0" font-size="12" text-anchor="middle">SR_MODE — scan</text>

  <rect x="526" y="150" width="170" height="72" rx="8" fill="#14243a" stroke="#f5a524" stroke-width="1.5"/>
  <text x="611" y="182" fill="#e6f1f5" font-size="16" font-weight="600" text-anchor="middle">Waiting</text>
  <text x="611" y="204" fill="#f5a524" font-size="12" text-anchor="middle">operator approval</text>

  <rect x="766" y="150" width="170" height="72" rx="8" fill="#14243a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="851" y="182" fill="#e6f1f5" font-size="16" font-weight="600" text-anchor="middle">Cleaning</text>
  <text x="851" y="204" fill="#4ade80" font-size="12" text-anchor="middle">CR_MODE — rework</text>

  <!-- Idle -> Sensing : START -->
  <line x1="218" y1="186" x2="282" y2="186" stroke="#2ec4d8" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="176" fill="#7fe3f0" font-size="12" text-anchor="middle" font-weight="600">START</text>

  <!-- Sensing -> Waiting : scan complete (reported by cell) -->
  <line x1="458" y1="186" x2="522" y2="186" stroke="#5b7a99" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aDash)"/>
  <text x="490" y="176" fill="#8aa4bd" font-size="11" text-anchor="middle">scan done</text>

  <!-- Waiting -> Cleaning : CONFIRM -->
  <line x1="698" y1="186" x2="762" y2="186" stroke="#2ec4d8" stroke-width="2" marker-end="url(#a)"/>
  <text x="730" y="176" fill="#7fe3f0" font-size="12" text-anchor="middle" font-weight="600">CONFIRM</text>

  <!-- Waiting -> Sensing : REINSPECT (loop below) -->
  <path d="M 611 226 C 611 282 371 282 371 230" fill="none" stroke="#2ec4d8" stroke-width="2" marker-end="url(#a)"/>
  <text x="491" y="276" fill="#7fe3f0" font-size="12" text-anchor="middle" font-weight="600">REINSPECT — scan the part again</text>

  <!-- Cleaning -> Idle : mission complete -->
  <path d="M 851 226 C 851 340 300 356 131 330 L 131 228" fill="none" stroke="#5b7a99" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aDash)"/>
  <text x="520" y="352" fill="#8aa4bd" font-size="12" text-anchor="middle">all defects cleaned → mission complete</text>

  <!-- STOP -->
  <path d="M 611 142 C 611 96 300 96 131 96 L 131 144" fill="none" stroke="#f26d6d" stroke-width="2" marker-end="url(#aStop)"/>
  <text x="380" y="88" fill="#f26d6d" font-size="12" text-anchor="middle" font-weight="600">STOP — abort from any running state</text>

  <text x="30" y="392" fill="#8aa4bd" font-size="12">Cyan arrows: operator commands published on /harmony/cmd_input.   Grey dashed arrows: state changes reported by the cell controller.</text>
</svg>
